name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jest:
    # Fixat a 24.04: ubuntu-latest ja és 26.04 i Playwright 1.56.1 no hi
    # instal·la Chromium (vegeu smoke). Mateix sistema per a tots dos jobs.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
